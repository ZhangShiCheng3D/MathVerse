# All app/gateway/db creds live here; nothing references a key in plaintext YAML.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: mathverse
type: Opaque
stringData:
  # --- mathverse-api ---
  JWT_SECRET: "REPLACE_ME_RANDOM_LONG"
  DEEPSEEK_API_KEY: "REPLACE_ME"          # mathverse-api degrade path + (reused) gateway
  DASHSCOPE_API_KEY: "REPLACE_ME"
  WECHAT_APP_ID: ""
  WECHAT_APP_SECRET: ""
  WECHAT_PAY_MCH_ID: ""
  WECHAT_PAY_API_KEY: ""
  # --- shared Postgres (P1) ---
  DEEPTUTOR_PG_DSN: "postgresql://mathverse:REPLACE_ME@postgres:5432/deeptutor"
  POSTGRES_USER: "mathverse"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "deeptutor"
  # --- LiteLLM gateway (P2) ---
  LITELLM_MASTER_KEY: "sk-REPLACE_ME_RANDOM_LONG"
  DEEPSEEK_KEY_1: "REPLACE_ME"            # add DEEPSEEK_KEY_2.. for more accounts
  DASHSCOPE_KEY_1: "REPLACE_ME"
