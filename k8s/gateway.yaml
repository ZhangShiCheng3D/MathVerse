# LiteLLM gateway (P2): multi-account LLM load balancing + global rate limiting.
# Config comes from the litellm-config ConfigMap (generated by kustomize from
# gateway/litellm-config.yaml). Scale replicas freely — Redis makes limits global.
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          args: ["--config", "/etc/litellm/litellm-config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom: { secretKeyRef: { name: app-secrets, key: LITELLM_MASTER_KEY } }
            - name: DEEPSEEK_KEY_1
              valueFrom: { secretKeyRef: { name: app-secrets, key: DEEPSEEK_KEY_1 } }
            - name: DASHSCOPE_KEY_1
              valueFrom: { secretKeyRef: { name: app-secrets, key: DASHSCOPE_KEY_1 } }
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: ""
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            requests: { cpu: "200m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: litellm-config
