# Data tier: Postgres (shared session/turn/event store, P1), Redis (gateway global
# rate limiting now; P3b pub/sub later), qdrant (RAG vectors).
#
# For production prefer MANAGED Postgres/Redis (RDS / CloudSQL / 腾讯云 TencentDB)
# and drop the corresponding StatefulSet here — just point DEEPTUTOR_PG_DSN /
# REDIS_HOST at the managed endpoint. The StatefulSets below are a self-hosted
# baseline. Set REPLACE_ME_STORAGECLASS to your cluster's storage class.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None        # headless for the StatefulSet
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: app-secrets, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "mathverse"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }   # tune to load
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: REPLACE_ME_STORAGECLASS
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]   # ephemeral cache/limit
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: "100m", memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant
  replicas: 1            # scale + shard for 万级 RAG QPS (see design doc §5)
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
            - containerPort: 6334
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: REPLACE_ME_STORAGECLASS
        resources:
          requests:
            storage: 20Gi
---
# Shared DeepTutor data for the web+bot replicas. DeepTutor keeps the RAG
# knowledge-base REGISTRY (kb_config.json), uploaded raw docs and on-disk indexes
# under /app/data — these are NOT in Postgres (only session/turn/event state is)
# and NOT in qdrant (only vectors). With a per-pod emptyDir those files are
# invisible across replicas, so a KB created on one replica 404s on another and
# RAG-grounded solving breaks non-deterministically. A ReadWriteMany volume makes
# /app/data shared so every replica sees the same knowledge bases.
#
# Requires an RWX-capable StorageClass (NFS / CephFS / EFS / Filestore). If your
# cluster has none, route all KB-mutating + RAG requests to a single replica
# instead (e.g. a dedicated role), or externalize the KB store.
# Caveat: concurrent re-index of the SAME KB from two replicas can race on the
# index files — KB writes are rare admin ops, but prefer to serialize them.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deeptutor-shared-data
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: REPLACE_ME_RWX_STORAGECLASS
  resources:
    requests:
      storage: 20Gi
